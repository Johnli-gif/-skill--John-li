name: A-share monitor

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force send alerts when triggered"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Print alert message without sending"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_push:
        description: "Send one PushPlus test notification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Five-minute deterministic price monitor. It does not call an LLM.
    # UTC ranges map to Beijing 09:25-11:35 and 12:55-15:05.
    # Offset by two minutes to reduce GitHub's documented top-of-hour congestion.
    - cron: "27-57/5 1 * * 1-5"
    - cron: "2-57/5 2 * * 1-5"
    - cron: "2-37/5 3 * * 1-5"
    - cron: "57 4 * * 1-5"
    - cron: "2-57/5 5-6 * * 1-5"
    - cron: "2-7/5 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ashare-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Shanghai
      TRADING_STATE_PATH: data/trading-state.json
      DECISION_LATEST_PATH: data/decision-latest.json
      ALERT_STATE_FILE: data/cloud-monitor/state.json
      SUMMARY_STATE_FILE: data/cloud-monitor/summary-state.json
      NOTIFICATION_RECEIPT_FILE: data/cloud-monitor/notification-receipt.json
      TRADE_HOURS_ONLY: "true"
      QUIET_REPEAT_MINUTES: ${{ secrets.QUIET_REPEAT_MINUTES || '30' }}
      WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      TRADING_STATE_JSON: ${{ secrets.TRADING_STATE_JSON }}
      DECISION_LATEST_JSON: ${{ secrets.DECISION_LATEST_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Materialize private runtime state
        run: |
          test -n "$TRADING_STATE_JSON"
          test -n "$DECISION_LATEST_JSON"
          mkdir -p data
          printf '%s' "$TRADING_STATE_JSON" > data/trading-state.json
          printf '%s' "$DECISION_LATEST_JSON" > data/decision-latest.json

      - name: Restore duplicate-alert state
        uses: actions/cache@v6
        with:
          path: |
            data/cloud-monitor/state.json
            data/cloud-monitor/summary-state.json
            data/cloud-monitor/notification-receipt.json
          key: ashare-monitor-state-${{ github.run_id }}
          restore-keys: |
            ashare-monitor-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test PushPlus channel
        if: ${{ inputs.test_push == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("PUSHPLUS_TOKEN", "").strip()
          if not token:
              raise SystemExit("PUSHPLUS_TOKEN is not configured")

          payload = {
              "token": token,
              "title": "A股监控通道测试",
              "content": "操盘策略0710提醒通道已连接。交易时段每5分钟检查已批准价格信号；不会调用AI，也不会自动下单。",
              "template": "markdown",
          }
          req = urllib.request.Request(
              "https://www.pushplus.plus/send",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              body = resp.read().decode("utf-8", "replace")
          print(body)
          PY

      - name: Validate config
        run: |
          python -m json.tool data/trading-state.json >/dev/null
          python -m json.tool data/decision-latest.json >/dev/null
          python -m json.tool config/cloud-monitor-rules.json >/dev/null
          python -m py_compile scripts/cloud_monitor.py
          python -m unittest discover -s tests -p 'test_cloud_monitor.py' -v

      - name: Run monitor
        run: |
          args=()
          if [ "${{ inputs.force || 'false' }}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run --ignore-trading-time)
          fi
          python scripts/cloud_monitor.py "${args[@]}"
