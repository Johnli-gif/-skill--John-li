name: A-share monitor

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force send alerts when triggered"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Print alert message without sending"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_push:
        description: "Send one PushPlus test notification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      renewal_notice:
        description: "Send the external-trigger credential renewal reminder"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      health_check:
        description: "Check the external trigger heartbeat and decision expiry"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # GitHub only checks the external monitor heartbeat. cron-job.org is the
    # sole five-minute trigger, preventing duplicate 2-3 minute dispatches.
    - cron: "45 3 * * 1-5"
    - cron: "15 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ashare-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Shanghai
      TRADING_STATE_PATH: data/trading-state.json
      DECISION_LATEST_PATH: data/decision-latest.json
      ALERT_STATE_FILE: data/cloud-monitor/state.json
      SUMMARY_STATE_FILE: data/cloud-monitor/summary-state.json
      NOTIFICATION_RECEIPT_FILE: data/cloud-monitor/notification-receipt.json
      HEARTBEAT_STATE_FILE: data/cloud-monitor/heartbeat.json
      HEALTH_NOTICE_STATE_FILE: data/cloud-monitor/health-notice.json
      TRADE_HOURS_ONLY: "true"
      QUIET_REPEAT_MINUTES: ${{ secrets.QUIET_REPEAT_MINUTES || '30' }}
      MAX_QUOTE_AGE_MINUTES: "5"
      MAX_SOURCE_PRICE_DIFF_PCT: "0.20"
      HEARTBEAT_MAX_AGE_MINUTES: "12"
      WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_CALLBACK_URL: ${{ secrets.PUSHPLUS_CALLBACK_URL }}
      PUSHPLUS_VERIFY_ATTEMPTS: "12"
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      TRADING_STATE_JSON: ${{ secrets.TRADING_STATE_JSON }}
      DECISION_LATEST_JSON: ${{ secrets.DECISION_LATEST_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Materialize private runtime state
        run: |
          test -n "$TRADING_STATE_JSON"
          test -n "$DECISION_LATEST_JSON"
          mkdir -p data
          printf '%s' "$TRADING_STATE_JSON" > data/trading-state.json
          printf '%s' "$DECISION_LATEST_JSON" > data/decision-latest.json

      - name: Prepare persistent monitor state
        run: |
          mkdir -p data/cloud-monitor
          for file in state.json summary-state.json notification-receipt.json heartbeat.json health-notice.json; do
            test -e "data/cloud-monitor/$file" || printf '{}\n' > "data/cloud-monitor/$file"
          done

      - name: Restore duplicate-alert state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/cloud-monitor/state.json
            data/cloud-monitor/summary-state.json
            data/cloud-monitor/notification-receipt.json
            data/cloud-monitor/heartbeat.json
            data/cloud-monitor/health-notice.json
          key: ashare-monitor-state-${{ github.run_id }}
          restore-keys: |
            ashare-monitor-state-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate config
        run: |
          python -m json.tool data/trading-state.json >/dev/null
          python -m json.tool data/decision-latest.json >/dev/null
          python -m json.tool config/cloud-monitor-rules.json >/dev/null
          python -m json.tool config/china-exchange-calendar.json >/dev/null
          python -m py_compile scripts/cloud_monitor.py
          python -m py_compile scripts/trading_ledger.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run monitor
        run: |
          args=()
          if [ "${{ inputs.force || 'false' }}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run --ignore-trading-time)
          fi
          if [ "${{ inputs.test_push || 'false' }}" = "true" ]; then
            args+=(--test-notification)
          elif [ "${{ inputs.renewal_notice || 'false' }}" = "true" ]; then
            args+=(--renewal-notice)
          elif [ "${{ inputs.health_check || 'false' }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--health-check)
          fi
          python scripts/cloud_monitor.py "${args[@]}"

      - name: Save duplicate-alert state
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/cloud-monitor/state.json
            data/cloud-monitor/summary-state.json
            data/cloud-monitor/notification-receipt.json
            data/cloud-monitor/heartbeat.json
            data/cloud-monitor/health-notice.json
          key: ashare-monitor-state-${{ github.run_id }}
