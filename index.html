<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A股操盘摘要面板</title>
    <link rel="stylesheet" href="styles.css?v=20260704-lean-panel">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="工作台导航">
        <div class="brand-block">
          <div class="brand-mark">A</div>
          <div>
            <h1>A股操盘摘要</h1>
            <p id="todayLabel"></p>
          </div>
        </div>

        <nav class="nav-list">
          <a href="#battle" class="nav-item active">最终建议</a>
          <a href="#holdings" class="nav-item">当前持仓</a>
          <a href="#alerts" class="nav-item">触发提醒</a>
          <a href="#nextTrack" class="nav-item">下一方向</a>
        </nav>

        <section class="risk-panel" aria-labelledby="riskTitle">
          <h2 id="riskTitle">面板定位</h2>
          <p>这里仅同步截图、行情和云端触发状态。最终买卖判断以对话框生成结论为准。</p>
          <label>
            <span>单笔风险</span>
            <input id="riskPerTrade" type="range" min="0.5" max="5" step="0.5">
            <strong id="riskValue"></strong>
          </label>
          <label>
            <span>最大仓位</span>
            <input id="maxPosition" type="range" min="10" max="100" step="5">
            <strong id="positionValue"></strong>
          </label>
          <button id="resetData" class="ghost-button" type="button">重置本地数据</button>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Daily China A-share pulse</p>
            <h2>只看结论、持仓、触发、下一方向</h2>
          </div>
          <div class="market-state" aria-label="市场状态">
            <span id="marketMood">均衡观察</span>
            <strong id="focusScore">--</strong>
          </div>
        </header>

        <section class="content-grid">
          <section id="battle" class="panel panel-wide" aria-labelledby="battleTitle">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Final decision</p>
                <h3 id="battleTitle">今日最终建议</h3>
              </div>
            </div>
            <div id="battlePlan" class="battle-plan"></div>
          </section>

          <section id="holdings" class="panel panel-wide" aria-labelledby="holdingsTitle">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Current holdings</p>
                <h3 id="holdingsTitle">当前持仓</h3>
              </div>
            </div>
            <div id="leanHoldings" class="lean-list"></div>
          </section>

          <section id="alerts" class="panel panel-wide" aria-labelledby="alertsTitle">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Trigger alerts</p>
                <h3 id="alertsTitle">触发提醒</h3>
              </div>
            </div>
            <div id="leanAlerts" class="lean-list"></div>
          </section>

          <section id="nextTrack" class="panel panel-wide" aria-labelledby="nextTrackTitle">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Next track</p>
                <h3 id="nextTrackTitle">下一候选方向</h3>
              </div>
            </div>
            <div id="leanNextTrack" class="lean-list"></div>
          </section>

        </section>
      </section>
    </main>

    <div class="legacy-compat" aria-hidden="true">
      <input id="goalStartAssets" type="number">
      <input id="goalCurrentAssets" type="number">
      <input id="accountCashBalance" type="number">
      <input id="goalTargetReturn" type="number">
      <input id="goalMaxDrawdown" type="number">
      <input id="goalDeadline" type="date">
      <button id="updateGoal" type="button"></button>
      <button id="recalcSizing" type="button"></button>
      <button id="resetIntradayChecks" type="button"></button>
      <button id="saveCloseReview" type="button"></button>
      <div id="goalTracker"></div>
      <div id="sizingPlanner"></div>
      <div id="intradayChecklist"></div>
      <div id="closeReviewBox"></div>
    </div>

    <script src="app.js?v=20260704-lean-panel"></script>
  </body>
</html>
